# GitHub Pages 배포 (수동 실행 전용)
# - 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾼 뒤,
#   Actions 탭에서 이 워크플로를 직접 실행(Run workflow)해야만 배포된다.
# - push 로는 자동 실행되지 않는다.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나만 배포. 진행 중인 배포는 중간에 끊지 않는다(GitHub 공식 Pages 예제와 같은 설정)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      # 단위 테스트만(vite.config.ts 의 test.exclude 로 tests/e2e 제외). E2E 는 브라우저가 필요해 여기서 돌리지 않는다
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
